  <script>

      endPsi: 122,
      holdSeconds: 60

    let timerId = 0;
    let timerStartedAt = 0;

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function button(text, action, className = "btn") {
      const control = element("button", className, text);
      control.type = "button";
      control.addEventListener("click", action);
      return control;
    }

    function focusHeading() {
      view.querySelector(".screen-title")?.focus();
    }

    function stopTimer() {
      if (timerId) window.clearInterval(timerId);
      timerId = 0;

      view.replaceChildren();

      const heading = element("h2", "screen-title", "Free preview");
      heading.tabIndex = -1;
      view.append(heading, element("p", "preview-intro", "Choose a place to start."));

      const quiz = element("section", "preview-option");
      quiz.setAttribute("aria-labelledby", "quiz-title");
      const quizHeading = element("h3", "", "General Knowledge");
      quizHeading.id = "quiz-title";
      quiz.append(
        quizHeading,
        element("p", "", "25 General Knowledge questions, straight from the manual."),
        button("Start the free 25-question sample", startQuiz, "btn btn-primary btn-full")
      );

      const air = element("section", "preview-option");
      air.setAttribute("aria-labelledby", "air-title");
      const airHeading = element("h3", "", "Air Brake Check — Step 1");
      airHeading.id = "air-title";
      air.append(
        airHeading,
        element("p", "", STEP_ONE.name),
        button("Start the check — Step 1", startAirBrake, "btn btn-primary btn-full")
      );

      view.append(quiz, air);
      if (shouldFocus) focusHeading();
    }

    function addActivityHeading(title, progressText) {
      const header = element("div", "activity-head");
      if (progressText) header.append(element("p", "progress-line", progressText));
      const heading = element("h2", "screen-title", title);
      heading.tabIndex = -1;
      header.append(heading);
      view.append(header);
    }

    function renderQuizQuestion(answered = null) {
      view.replaceChildren();
      const question = questions[questionIndex];
      addActivityHeading(
        "Free sample — General Knowledge",
        `Question ${questionIndex + 1} of ${questions.length}`
      );
      view.append(element("p", "question-text", question.q));

      if (answered === null) {
        const answers = element("ol", "answer-list");
        question.choices.forEach((choice, index) => {
          const item = element("li");
          item.append(button(choice, () => answerQuiz(index), "btn answer-btn"));
          answers.append(item);
        });
        view.append(answers);
      } else {
        const right = answered === question.answer;
        if (right) correctAnswers++;
        const feedback = element("div", `feedback${right ? "" : " is-wrong"}`);
        feedback.setAttribute("role", "status");
        feedback.setAttribute("aria-live", "polite");
        feedback.append(element("p", "", right ? "Right." : `Wrong. The right answer is: ${question.choices[question.answer]}`));
        feedback.append(element("p", "citation", `Source: ${question.citation}`));
        feedback.append(element("p", "", question.why));
        view.append(feedback);
        view.append(button("Next question", nextQuizQuestion, "btn btn-primary"));
      }

      view.append(button("Back to preview", renderHome, "btn btn-secondary"));
      focusHeading();
    }

    function answerQuiz(index) {
      renderQuizQuestion(index);
    }

    function startQuiz() {
      questionIndex = 0;
      correctAnswers = 0;
      renderQuizQuestion();
    }

    function nextQuizQuestion() {
      questionIndex++;
      if (questionIndex >= questions.length) {
        renderQuizResult();
      } else {
        renderQuizQuestion();
      }
    }

    function renderQuizResult() {
      view.replaceChildren();
      addActivityHeading("Free sample — done");
      view.append(element("p", "question-text", `You got ${correctAnswers} of ${questions.length} right.`));
      view.append(element("p", "", "That was 25 of 290 questions. The full app has the rest — plus the pre-trip trainer with all 102 items in order, the air-brake trainer with the working gauge, backing, road, and timed mocks. $29 once, yours forever."));
      const purchase = element("a", "btn btn-primary buy-button", "Get the full app — $29 once");
      purchase.href = "https://ko-fi.com/s/bbd02343ef";
      view.append(
        purchase,
        button("Try the sample again", startQuiz, "btn btn-primary"),
        button("Back to preview", renderHome, "btn btn-secondary")
      );
      focusHeading();
    }

    function renderAirBrakeSetup() {
      stopTimer();
      view.replaceChildren();
      addActivityHeading("Air Brake Check — Step 1");
      view.append(element("p", "setup-copy", STEP_ONE.setup));
      view.append(element("p", "citation", STEP_ONE.citation));
      view.append(element("p", "prompt", `SAY IT BEFORE IT HAPPENS — ${STEP_ONE.ask}`));

      const choices = element("div", "answer-list");
      STEP_ONE.choices.forEach((choice) => {
        choices.append(button(choice, () => answerAirBrake(choice), "btn answer-btn"));
      });
      view.append(choices);
      view.append(button("Back to preview", renderHome, "btn btn-secondary"));
      focusHeading();
    }

    function startAirBrake() {
      renderAirBrakeSetup();
    }

    function answerAirBrake(choice) {
      if (choice !== STEP_ONE.correct) {
        renderAirBrakeFail(
          `Wrong number on Step 1 (${STEP_ONE.name}). You said ${choice}; the manual says ${STEP_ONE.correct}. ${STEP_ONE.correctNote}`
        );
        return;
      }
      renderAirBrakeCountdown();
    }

    function renderAirBrakeCountdown() {
      stopTimer();
      view.replaceChildren();
      addActivityHeading(`Step 1 — ${STEP_ONE.name}`);

      const pressure = element("section", "pressure-panel");
      pressure.setAttribute("aria-labelledby", "pressure-label");
      const label = element("label", "", "Air pressure");
      label.id = "pressure-label";
      const reading = element("output", "pressure-reading", `${STEP_ONE.startPsi} PSI`);
      reading.id = "pressure-reading";
      reading.setAttribute("aria-live", "off");
      const dropMeter = document.createElement("progress");
      dropMeter.id = "pressure-drop";
      dropMeter.max = 4;
      dropMeter.value = 0;
      dropMeter.setAttribute("aria-label", "Pressure drop, out of 4 PSI");
      const dropText = element("p", "", "Pressure drop: 0 PSI");
      dropText.id = "pressure-drop-text";
      pressure.append(label, reading, dropMeter, dropText);

      const timer = element("p", "timer", "Holding the foot brake… 60 seconds left. Do not fan yet.");
      timer.id = "test-timer";
      timer.setAttribute("role", "status");
      timer.setAttribute("aria-live", "off");
      const failCopy = element("p", "", "Watch the gauge. The drop must be no more than 3 PSI single / 4 PSI combination in one minute.");
      const failActions = element("div", "fail-actions");
      failActions.append(
        button("Fan the brakes now (FAIL — the minute is not up)", () => {
          renderAirBrakeFail("You fanned the brakes before the one-minute leak test was done. The leak test is a real 60 seconds — fanning early is a fail.");
        }, "btn btn-secondary"),
        button("Restart the engine (FAIL — engine must stay OFF, key ON)", () => {
          renderAirBrakeFail("You restarted the engine. The manual requires the engine OFF, key ON.");
        }, "btn btn-secondary")
      );

      view.append(pressure, timer, failCopy, failActions);
      view.append(button("Back to preview", renderHome, "btn btn-secondary"));
      focusHeading();

      timerStartedAt = Date.now();
      timerId = window.setInterval(updateAirBrakeCountdown, 1000);
    }

    function updateAirBrakeCountdown() {
      const elapsed = Math.min(STEP_ONE.holdSeconds, Math.floor((Date.now() - timerStartedAt) / 1000));
      const remaining = STEP_ONE.holdSeconds - elapsed;
      const pressureDrop = (STEP_ONE.startPsi - STEP_ONE.endPsi) * elapsed / STEP_ONE.holdSeconds;
      const pressure = STEP_ONE.startPsi - pressureDrop;
      const timer = document.querySelector("#test-timer");
      const reading = document.querySelector("#pressure-reading");
      const meter = document.querySelector("#pressure-drop");
      const dropText = document.querySelector("#pressure-drop-text");
      if (!timer || !reading || !meter || !dropText) {
        stopTimer();
        return;
      }

      timer.textContent = remaining > 0
        ? `Holding the foot brake… ${remaining} seconds left. Do not fan yet.`
        : "One minute held.";
      reading.textContent = `${pressure.toFixed(1)} PSI`;
      meter.value = pressureDrop;
      dropText.textContent = `Pressure drop: ${pressureDrop.toFixed(1)} PSI`;

      if (remaining === 0) {
        stopTimer();
        renderAirBrakePassed();
      }
    }

    function renderAirBrakePassed() {
      view.replaceChildren();
      addActivityHeading(`Step 1 passed — ${STEP_ONE.name}`);
      view.append(
        element("p", "", `One minute held. Pressure fell from ${STEP_ONE.startPsi} to ${STEP_ONE.endPsi} PSI — inside the limit. ${STEP_ONE.correctNote}`),
        button("Run Step 1 again", startAirBrake, "btn btn-primary"),
        button("Back to preview", renderHome, "btn btn-secondary")
      );
      focusHeading();
    }

    function renderAirBrakeFail(reason) {
      stopTimer();
      view.replaceChildren();
      addActivityHeading("AUTOMATIC FAIL — Vehicle Inspection");
      const fail = element("div", "fail-screen");
      fail.setAttribute("role", "alert");
      fail.append(element("h3", "", "Step 1 — Leakage rate — brakes applied"));
      fail.append(element("p", "", reason));
      view.append(
        fail,
        button("Restart from Step 1", startAirBrake, "btn btn-primary"),
        button("Back to preview", renderHome, "btn btn-secondary")
      );
      focusHeading();
    }

    renderHome(false);
  </script>
</body>
</html>
